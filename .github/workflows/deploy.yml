name: Booking web CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: booking-web-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: douglassmartins/agendamento-booking-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --watch=false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        run: |
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: pilot
    steps:
      - name: Validate deployment configuration
        run: |
          test -n "${{ secrets.VPS_HOST }}" || { echo 'Missing secrets.VPS_HOST' >&2; exit 1; }
          test -n "${{ secrets.VPS_USER }}" || { echo 'Missing secrets.VPS_USER' >&2; exit 1; }
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo 'Missing secrets.VPS_SSH_KEY' >&2; exit 1; }

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Pull, restart and validate booking container remotely
        env:
          CONTAINER_NAME: ${{ vars.VPS_BOOKING_CONTAINER || 'agendamento-booking-web' }}
          HOST_PORT: ${{ vars.VPS_BOOKING_HOST_PORT || '4200' }}
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s -- \
            "$IMAGE_NAME:$IMAGE_TAG" "$CONTAINER_NAME" "$HOST_PORT" <<'REMOTE'
          set -eu
          image="$1"
          container="$2"
          host_port="$3"
          docker pull "$image"
          docker rm -f "$container" 2>/dev/null || true
          docker run -d --name "$container" --restart unless-stopped -p "${host_port}:80" "$image"
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container")
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker logs "$container" >&2; exit 1; }
            sleep 2
          done
          [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container")" = healthy ]
          docker exec "$container" wget -q -O /dev/null http://127.0.0.1/
          REMOTE
