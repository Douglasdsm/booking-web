<main class="auth-shell">
  <section class="auth-card">
    <p class="eyebrow">Conta</p>
    <h1>Criar conta</h1>
    <p class="subtitle">Crie uma conta permanente para continuar o convite.</p>

    @if (error()) {
      <div class="error-message" data-testid="register-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Nome</span>
        <input type="text" formControlName="nome" autocomplete="name" />
      </label>

      <label>
        <span>E-mail</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        <span>Telefone</span>
        <input type="tel" formControlName="phone" autocomplete="tel" />
      </label>

      <label>
        <span>CPF/CNPJ</span>
        <input type="text" formControlName="cpfCnpj" inputmode="numeric" />
      </label>

      <label>
        <span>Usuario</span>
        <input type="text" formControlName="user" autocomplete="username" />
      </label>

      <label>
        <span>Senha</span>
        <input type="password" formControlName="senha" autocomplete="new-password" />
      </label>

      <label>
        <span>Confirmar senha</span>
        <input type="password" formControlName="confirmarSenha" autocomplete="new-password" />
      </label>

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Criando...' : 'Criar conta' }}
      </button>
    </form>

    <p class="switch-link">
      Ja tem conta?
      <a [routerLink]="loginCommands()" [queryParams]="loginQueryParams()">Entrar</a>
    </p>
  </section>
</main>
