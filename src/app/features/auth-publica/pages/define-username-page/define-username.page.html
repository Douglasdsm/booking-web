<main class="auth-shell">
  <section class="auth-card">
    <p class="eyebrow">Conta</p>
    <h1>Definir username</h1>
    <p class="subtitle">Escolha um username definitivo para continuar usando sua conta.</p>

    @if (error()) {
      <div class="error-message" data-testid="define-username-error">{{ error() }}</div>
    }
    @if (success()) {
      <div class="success-message" data-testid="define-username-success">Username definido com sucesso.</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Username</span>
        <input type="text" formControlName="username" autocomplete="username" autocapitalize="none" />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <small>{{ usernameErrorMessage() }}</small>
        }
      </label>

      <button type="submit" [disabled]="loading() || submitting()">
        @if (loading()) {
          Consultando...
        } @else {
          {{ submitting() ? 'Salvando...' : 'Salvar username' }}
        }
      </button>
    </form>

    <p class="switch-link">
      Precisa entrar novamente?
      <a [routerLink]="loginCommands()" [queryParams]="loginQueryParams()">Entrar</a>
    </p>
  </section>
</main>
