<app-booking-layout [companyName]="store.company()?.nomeEmpresa ?? null" [logoUrl]="companyLogoUrl()">
  <app-booking-stepper
    booking-stepper
    [currentIndex]="currentStepIndex()"
    [total]="steps.length"
  />

  @switch (store.currentStep()) {
    @case ('cliente') {
      <app-booking-cliente-step
        [name]="customerName()"
        [phone]="customerPhone()"
        [error]="store.error()"
        (nameChange)="customerName.set($event)"
        (phoneChange)="customerPhone.set($event)"
        (submit)="submitCustomer()"
      />
    }

    @case ('servicos') {
      <app-booking-servico-step
        [services]="store.services()"
        [selectedServices]="store.selectedServices()"
        [loading]="store.loading()"
        [error]="store.error()"
        (toggle)="toggleService($event)"
      />
    }

    @case ('prestadores') {
      <app-booking-profissional-step
        [professionals]="store.professionals()"
        [selectedProfessional]="store.selectedProfessional()"
        [loading]="store.loading()"
        [error]="store.error()"
        (select)="selectProfessional($event)"
      />
    }

    @case ('agenda') {
      <app-booking-data-horario-step
        [dates]="dateOptions()"
        [selectedDate]="store.selectedDate()"
        [slots]="store.availableSlots()"
        [selectedSlotKey]="selectedSlotKey()"
        [canChooseSchedule]="!!store.selectedProfessional() && !!store.totalDurationMinutes()"
        [loading]="store.loading()"
        [error]="store.error()"
        (dateChange)="selectDate($event)"
        (slotChange)="selectSlot($event)"
      />
    }

    @case ('confirmacao') {
      <app-booking-confirmacao-step
        [customer]="store.customer()"
        [services]="store.selectedServices()"
        [professional]="store.selectedProfessional()"
        [date]="store.selectedDate()"
        [slot]="store.selectedSlot()"
        [totalPrice]="store.totalPrice()"
        [error]="store.error()"
      />
    }

    @case ('sucesso') {
      <app-booking-sucesso-step
        [services]="store.selectedServices()"
        [professional]="store.selectedProfessional()"
        [date]="store.selectedDate()"
        [slot]="store.selectedSlot()"
        [totalPrice]="store.totalPrice()"
      />
    }
  }

  <app-booking-footer-actions
    booking-footer
    [continueText]="footerContinueText()"
    [continueDisabled]="continueDisabled()"
    [backDisabled]="backDisabled()"
    [showBack]="!backDisabled()"
    (back)="goBack()"
    (continue)="continueCurrentStep()"
  />
</app-booking-layout>
